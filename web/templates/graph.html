<!DOCTYPE html>
<html lang="it">
<head>{{template "head" .}}<title>pensieri // rete</title>
<style>
#netCanvas { display:block; width:100%; cursor:grab; }
#netCanvas:active { cursor:grabbing; }
.graph-wrap { position:relative; }
.graph-footer {
  display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
  padding:0.5rem 1.2rem;
  background: linear-gradient(#e9f0f8, #d8e5f2);
  border-top: 1px solid #9fb6cf;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  font-size:0.72rem; color: #4c5a6a;
  font-family: 'Courier New', monospace;
}
.leg { display:flex; align-items:center; gap:0.45rem; font-weight:600; }
.leg-bar {
  width:32px; height:12px; border:1px solid;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
}
.graph-footer .sep { color: #9fb3ca; }
</style>
</head>
<body>
{{template "nav" .}}
<div class="container" style="padding-top:1rem">
  <div class="panel" style="padding:0; overflow:hidden">
    <div class="panel-title" style="margin:0">// il tuo network</div>
    <div class="graph-wrap">
      <canvas id="netCanvas"></canvas>
    </div>
    <div class="graph-footer">
      <span class="leg">
        <span class="leg-bar" style="background:linear-gradient(#5f99da,#2f6cae);border-color:#224f86"></span> utente
      </span>
      <span class="leg">
        <span class="leg-bar" style="background:linear-gradient(#f2c060,#c2780a);border-color:#9a5c00"></span> tu
      </span>
      <span class="sep">//</span>
      <span>trascina nodo &middot; hover per connessioni &middot; click &rarr; profilo</span>
      <span class="sep">//</span>
      <span id="netInfo">—</span>
    </div>
  </div>
</div>

<script>
(function () {
  const DATA = {{.GraphJSON}};
  if (!DATA || !DATA.nodes) return;

  const canvas = document.getElementById('netCanvas');
  const ctx    = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const cw  = canvas.parentElement.clientWidth;
    const ch  = Math.max(460, Math.min(600, window.innerHeight - 220));
    canvas.width  = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = cw; H = ch;
  }
  resize();
  window.addEventListener('resize', () => { resize(); scatter(); });

  /* avatar colour — mirrors Go avatarColor */
  function avatarColor(u) {
    let h = 0;
    for (let i = 0; i < u.length; i++) h = (Math.imul(h, 31) + u.charCodeAt(i)) | 0;
    const hue = (((h % 360) + 360) % 360);
    return `hsl(${hue}, 55%, 52%)`;
  }

  /* node dimensions */
  const TH = 18; /* title bar height */
  const BH = 26; /* body height */
  const NH = TH + BH;
  function nw(n) { return Math.max(104, n.username.length * 8 + 52); }

  /* build graph */
  const nodeMap = {};
  const nodes = DATA.nodes.map(d => {
    const n = { ...d, x:0, y:0, vx:0, vy:0, color: avatarColor(d.username) };
    nodeMap[d.id] = n;
    return n;
  });
  const edges = DATA.edges || [];

  document.getElementById('netInfo').textContent =
    nodes.length + ' nodi · ' + edges.length + ' archi';

  function scatter() {
    nodes.forEach((n, i) => {
      const a = (2 * Math.PI * i) / nodes.length;
      const r = Math.min(W, H) * 0.27;
      n.x = W/2 + r * Math.cos(a) + (Math.random()-0.5)*16;
      n.y = H/2 + r * Math.sin(a) + (Math.random()-0.5)*16;
      n.vx = 0; n.vy = 0;
    });
  }
  scatter();

  /* force simulation */
  let ticks = 0, simOn = true;

  function tick() {
    const REP = 7500, SPR_LEN = 150, SPR_K = 0.042, DAMP = 0.80, GRAV = 0.0028;

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = b.x-a.x, dy = b.y-a.y;
        const d2 = dx*dx + dy*dy || 1, d = Math.sqrt(d2);
        const f  = REP / d2;
        a.vx -= f*dx/d; a.vy -= f*dy/d;
        b.vx += f*dx/d; b.vy += f*dy/d;
      }
    }
    edges.forEach(e => {
      const a = nodeMap[e.from], b = nodeMap[e.to];
      if (!a || !b) return;
      const dx = b.x-a.x, dy = b.y-a.y;
      const d = Math.sqrt(dx*dx+dy*dy) || 1;
      const f = (d - SPR_LEN) * SPR_K;
      a.vx += f*dx/d; a.vy += f*dy/d;
      b.vx -= f*dx/d; b.vy -= f*dy/d;
    });
    nodes.forEach(n => {
      n.vx += (W/2 - n.x) * GRAV;
      n.vy += (H/2 - n.y) * GRAV;
      n.vx *= DAMP; n.vy *= DAMP;
      n.x  += n.vx; n.y  += n.vy;
      n.x = Math.max(60, Math.min(W-60, n.x));
      n.y = Math.max(30, Math.min(H-30, n.y));
    });
    if (++ticks > 340) simOn = false;
  }

  /* pan / drag */
  let pan = {x:0, y:0}, dragged = null, panning = false, lastM = null, downM = null, hovN = null;

  function toWorld(cx, cy) { return {x: cx-pan.x, y: cy-pan.y}; }

  function hitNode(wx, wy) {
    for (let i = nodes.length-1; i >= 0; i--) {
      const n = nodes[i], hw = nw(n)/2;
      if (wx >= n.x-hw && wx <= n.x+hw && wy >= n.y-NH/2 && wy <= n.y+NH/2) return n;
    }
    return null;
  }

  function onDown(mx, my) {
    const w = toWorld(mx, my);
    const hit = hitNode(w.x, w.y);
    if (hit) { dragged = hit; simOn = true; ticks = 0; }
    else panning = true;
    lastM = {x:mx, y:my};
    downM = {x:mx, y:my};
  }
  function onMove(mx, my) {
    if (dragged) {
      const w = toWorld(mx, my);
      dragged.x = w.x; dragged.y = w.y; dragged.vx = 0; dragged.vy = 0;
      simOn = true; ticks = 0;
    } else if (panning) {
      pan.x += mx - lastM.x; pan.y += my - lastM.y;
    } else {
      hovN = hitNode(toWorld(mx, my).x, toWorld(mx, my).y);
    }
    lastM = {x:mx, y:my};
  }
  function onUp(mx, my) {
    if (dragged && downM && Math.abs(mx-downM.x)<5 && Math.abs(my-downM.y)<5)
      window.location.href = '/@' + dragged.username;
    dragged = null; panning = false; downM = null;
  }

  canvas.addEventListener('mousedown', e => { const r=canvas.getBoundingClientRect(); onDown(e.clientX-r.left,e.clientY-r.top); });
  canvas.addEventListener('mousemove', e => { const r=canvas.getBoundingClientRect(); onMove(e.clientX-r.left,e.clientY-r.top); });
  canvas.addEventListener('mouseup',   e => { const r=canvas.getBoundingClientRect(); onUp(e.clientX-r.left,e.clientY-r.top); });
  canvas.addEventListener('mouseleave', () => { dragged=null; panning=false; hovN=null; });

  canvas.addEventListener('touchstart', e => { e.preventDefault(); const r=canvas.getBoundingClientRect(),t=e.touches[0]; onDown(t.clientX-r.left,t.clientY-r.top); },{passive:false});
  canvas.addEventListener('touchmove',  e => { e.preventDefault(); const r=canvas.getBoundingClientRect(),t=e.touches[0]; onMove(t.clientX-r.left,t.clientY-r.top); },{passive:false});
  canvas.addEventListener('touchend',   e => { const r=canvas.getBoundingClientRect(),t=e.changedTouches[0]; onUp(t.clientX-r.left,t.clientY-r.top); });

  /* rendering */
  const PCOL = { online:'#2e8b3d', away:'#c2780a', busy:'#cc3333', offline:'#9aa7b4' };

  function drawEdge(a, b, hi) {
    const hw_a = nw(a)/2 - 1, hw_b = nw(b)/2 - 1, hh = NH/2 - 1;
    const dx = b.x-a.x, dy = b.y-a.y;
    const d  = Math.sqrt(dx*dx+dy*dy) || 1;
    const nx = dx/d, ny = dy/d;
    const sx = a.x + nx*hw_a, sy = a.y + ny*hh;
    const ex = b.x - nx*(hw_b+2), ey = b.y - ny*(hh+2);

    ctx.beginPath();
    ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
    ctx.strokeStyle = hi ? 'rgba(194,120,10,0.85)' : 'rgba(59,127,196,0.45)';
    ctx.lineWidth   = hi ? 2 : 1.5;
    ctx.stroke();

    /* arrowhead */
    const AL = 10, AW = 4;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - nx*AL + ny*AW, ey - ny*AL - nx*AW);
    ctx.lineTo(ex - nx*AL - ny*AW, ey - ny*AL + nx*AW);
    ctx.closePath();
    ctx.fillStyle = hi ? 'rgba(194,120,10,0.85)' : 'rgba(59,127,196,0.60)';
    ctx.fill();
  }

  function drawNode(n, hi) {
    const w = nw(n);
    const x = Math.floor(n.x - w/2), y = Math.floor(n.y - NH/2);
    const self = n.is_self;

    /* drop shadow */
    ctx.fillStyle = 'rgba(30,50,80,0.16)';
    ctx.fillRect(x+3, y+3, w, NH);

    /* body (white panel) */
    const bodyG = ctx.createLinearGradient(x, y+TH, x, y+NH);
    bodyG.addColorStop(0, hi ? '#f0f6ff' : '#ffffff');
    bodyG.addColorStop(1, hi ? '#e4eefa' : '#f5f8fd');
    ctx.fillStyle = bodyG;
    ctx.fillRect(x, y+TH, w, BH);

    /* title bar gradient */
    const tg = ctx.createLinearGradient(x, y, x, y+TH);
    if (self) {
      tg.addColorStop(0, '#f2c060');
      tg.addColorStop(0.48, '#c2780a');
      tg.addColorStop(0.5,  '#b06800');
      tg.addColorStop(1,    '#9a5600');
    } else {
      tg.addColorStop(0, '#5f99da');
      tg.addColorStop(0.48, '#3b7fc4');
      tg.addColorStop(0.5,  '#2f6cae');
      tg.addColorStop(1,    '#255a9e');
    }
    ctx.fillStyle = tg;
    ctx.fillRect(x, y, w, TH);

    /* title bar inner highlight */
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillRect(x+1, y+1, w-2, 1);

    /* outer border */
    ctx.strokeStyle = self ? '#9a5c00' : (hi ? '#3b7fc4' : '#9fb6cf');
    ctx.lineWidth   = (hi || self) ? 1.5 : 1;
    ctx.strokeRect(x+0.5, y+0.5, w-1, NH-1);

    /* divider between title and body */
    ctx.strokeStyle = self ? '#9a5600' : '#224f86';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y+TH); ctx.lineTo(x+w, y+TH); ctx.stroke();

    /* avatar initial in title bar */
    const AV = 12, avX = x+3, avY = y+(TH-AV)/2;
    ctx.fillStyle = self ? 'rgba(0,0,0,0.18)' : 'rgba(0,0,0,0.20)';
    ctx.fillRect(avX, avY, AV, AV);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.username[0].toUpperCase(), avX+AV/2, avY+AV/2+0.5);

    /* username in title */
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('// @' + n.username, x+19, y+TH/2+0.5);

    /* presence in body */
    const pc = PCOL[n.presence] || PCOL.online;
    /* presence dot (circle) */
    ctx.fillStyle = pc;
    ctx.beginPath();
    ctx.arc(x+10, y+TH+BH/2, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#4c5a6a';
    ctx.font = '8px monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(n.presence || 'online', x+18, y+TH+BH/2+0.5);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    /* light blue background gradient */
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#d7e4f3');
    bg.addColorStop(0.4, '#c3d6ec');
    bg.addColorStop(1, '#b4cae4');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    /* dot pattern (mimics body background) */
    ctx.fillStyle = 'rgba(255,255,255,0.48)';
    for (let gx = 0; gx < W; gx += 4)
      for (let gy = 0; gy < H; gy += 4)
        ctx.fillRect(gx, gy, 1, 1);

    ctx.save();
    ctx.translate(pan.x, pan.y);

    /* highlight sets */
    const hiE = new Set(), hiN = new Set();
    if (hovN) {
      edges.forEach((e, i) => {
        if (e.from === hovN.id || e.to === hovN.id) { hiE.add(i); hiN.add(e.from); hiN.add(e.to); }
      });
    }

    /* dim edges first */
    edges.forEach((e, i) => {
      if (hiE.has(i)) return;
      const a = nodeMap[e.from], b = nodeMap[e.to];
      if (a && b) drawEdge(a, b, false);
    });
    /* bright highlighted edges on top */
    edges.forEach((e, i) => {
      if (!hiE.has(i)) return;
      const a = nodeMap[e.from], b = nodeMap[e.to];
      if (a && b) drawEdge(a, b, true);
    });

    /* nodes */
    nodes.forEach(n => drawNode(n, hovN ? hiN.has(n.id) : false));

    /* empty-state hint */
    if (nodes.length <= 1) {
      ctx.fillStyle = 'rgba(42,95,158,0.45)';
      ctx.font = '11px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('[ segui altri utenti per espandere la rete ]', W/2, H/2 + 55);
    }

    ctx.restore();
  }

  (function loop() {
    if (simOn) tick();
    render();
    requestAnimationFrame(loop);
  })();

})();
</script>
{{template "statusbar" .}}
</body>
</html>
