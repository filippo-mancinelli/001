<!DOCTYPE html>
<html lang="it">
<head>{{template "head" .}}<title>pensieri // login</title></head>
<body>
<div class="container" style="max-width:420px; padding-top:5rem">
  <div style="text-align:center; margin-bottom:2rem">
    <div class="site-title" style="font-size:2.2rem">[ <span>pensieri</span> ]</div>
    <div class="auth-tagline">PERSONAL KNOWLEDGE NETWORK v0.1</div>
  </div>

  <div class="panel">
    <div class="panel-title">// autenticazione</div>

    {{if .error}}
    <div class="alert alert-error">{{.error}}</div>
    {{end}}

    <form method="POST" action="/login">
      <div class="form-group">
        <label>username</label>
        <input type="text" name="username" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label>password</label>
        <input type="password" name="password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn" style="width:100%">[ accedi ]</button>
    </form>

    <div style="text-align:right; font-size:0.72rem; margin-top:0.5rem">
      <a href="/forgot">password dimenticata?</a>
    </div>

    <hr class="divider">
    <div style="text-align:center; font-size:0.75rem; color:var(--text-dim)">
      non hai un account? <a href="/register">registrati</a>
    </div>
  </div>
</div>
</body>
</html>
