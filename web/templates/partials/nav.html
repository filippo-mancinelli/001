{{define "nav"}}

<header>
  <div class="container nav-inner">

    {{if .User}}
    <nav>
      <a href="/">feed</a>
      <a href="/search">cerca</a>
      <a href="/@{{.User.Username}}">@{{.User.Username}}</a>
      <a href="/notifications">notifiche</a>

      <form method="POST" action="/logout" style="display:inline">
