{{define "avatar"}}
<span class="avatar-wrap">
  {{if .AvatarURL}}
  <img class="avatar" src="{{.AvatarURL}}" alt="@{{.Username}}" loading="lazy">
  {{else}}
  <span class="avatar avatar-fallback" style="background:{{avatarColor .Username}}">{{initial .Username}}</span>
  {{end}}
  {{if .Presence}}<span class="presence presence-{{.Presence}}" title="{{.Presence}}"></span>{{end}}
</span>
{{end}}
