{{define "pensiero-editor"}}
<div class="panel" style="margin-top:0.5rem">
  <div class="panel-title">// scrivi un pensiero</div>
  <form hx-post="/pensieri" hx-target="#pensiero-editor-area" hx-swap="innerHTML">
    <div class="form-group">
      <label>su chi scrivi</label>
      <select name="subject_id">
        {{range .Following}}
        <option value="{{.ID}}">@{{.Username}}</option>
        {{end}}
      </select>
    </div>
    <div class="form-group">
      <label>versione per (lascia vuoto = tutti)</label>
      <select name="audience_id">
        <option value="">— tutti gli altri —</option>
        {{range .Following}}
        <option value="{{.ID}}">@{{.Username}}</option>
        {{end}}
      </select>
    </div>
    <div class="form-group">
      <label>pensiero</label>
      <textarea name="content" rows="4" placeholder="cosa pensi di questa persona?"></textarea>
    </div>
    <div style="display:flex; gap:0.5rem">
      <button type="submit" class="btn">[ salva ]</button>
      <button type="button" class="btn btn-red btn-sm"
        hx-get="/pensieri/annulla"
        hx-target="#pensiero-editor-area"
        hx-swap="innerHTML">annulla</button>
    </div>
  </form>
</div>
{{end}}
