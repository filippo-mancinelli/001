{{define "user-row"}}
<div class="user-row">
  <span class="avatar-sm">{{template "avatar" .}}</span>
  <a href="/@{{.Username}}" class="username">{{.Username}}</a>
  {{if .DisplayName}}<span class="user-row-name">{{.DisplayName}}</span>{{end}}
  {{if .Bio}}<span class="user-row-bio">— {{.Bio}}</span>{{end}}
</div>
{{end}}
