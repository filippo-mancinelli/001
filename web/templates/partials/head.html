{{define "head"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3b7fc4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14' fill='%233b73b9'>%5B%5D</text></svg>">
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="pensieri">
<link rel="stylesheet" href="{{asset "/static/css/retro.css"}}">
<script src="{{asset "/static/js/htmx.min.js"}}"></script>
<script>
  // pilota la barra di caricamento globale durante le richieste htmx
  document.addEventListener('htmx:beforeRequest', function () {
    document.body.classList.add('htmx-busy');
  });
  function clearBusy() {
    if (!document.querySelector('.htmx-request')) {
      document.body.classList.remove('htmx-busy');
    }
  }
  document.addEventListener('htmx:afterRequest', clearBusy);
  document.addEventListener('htmx:responseError', clearBusy);
  document.addEventListener('htmx:sendError', clearBusy);

  // registra il service worker della PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }

  // mostra il link "installa" solo quando il browser segnala che l'app è installabile
  // (beforeinstallprompt non scatta mai dentro la PWA già aperta)
  (function () {
    function isPWA() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: minimal-ui)').matches ||
             navigator.standalone === true;
    }
    if (isPWA()) return;
    window.addEventListener('beforeinstallprompt', function () {
      var links = document.querySelectorAll('[data-pwa-install]');
      for (var i = 0; i < links.length; i++) links[i].hidden = false;
    });
    window.matchMedia('(display-mode: standalone)').addEventListener('change', function (e) {
      if (e.matches) {
        var links = document.querySelectorAll('[data-pwa-install]');
        for (var i = 0; i < links.length; i++) links[i].hidden = true;
      }
    });
  })();

  // chiude i tooltip utente (<details class="user-tooltip">) quando si
  // clicca/tocca in un punto qualsiasi al di fuori del tooltip aperto
  document.addEventListener('click', function (e) {
    var open = document.querySelectorAll('details.user-tooltip[open]');
    for (var i = 0; i < open.length; i++) {
      if (!open[i].contains(e.target)) open[i].removeAttribute('open');
    }
  });

  // evidenzia la voce di navigazione corrispondente alla pagina attiva
  document.addEventListener('DOMContentLoaded', function () {
    var here = location.pathname;
    var links = document.querySelectorAll('.nav-bar a, .nav-actions a');
    for (var i = 0; i < links.length; i++) {
      var p = links[i].getAttribute('href') || '';
      var hashIdx = p.indexOf('#'); if (hashIdx >= 0) p = p.slice(0, hashIdx);
      var match = (p === '/') ? (here === '/') : (here === p || here.indexOf(p + '/') === 0);
      if (match) links[i].classList.add('is-active');
    }
  });
</script>
{{end}}
