{{define "head"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3b7fc4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14' fill='%233b73b9'>%5B%5D</text></svg>">
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="thoughts">
<link rel="stylesheet" href="/static/css/retro.css">
<script src="/static/js/htmx.min.js"></script>
<script>
  // pilota la barra di caricamento globale durante le richieste htmx
  document.addEventListener('htmx:beforeRequest', function () {
    document.body.classList.add('htmx-busy');
  });
  function clearBusy() {
    if (!document.querySelector('.htmx-request')) {
      document.body.classList.remove('htmx-busy');
    }
  }
  document.addEventListener('htmx:afterRequest', clearBusy);
  document.addEventListener('htmx:responseError', clearBusy);
  document.addEventListener('htmx:sendError', clearBusy);

  // registra il service worker della PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }

  // mostra il link "installa" solo se l'app non è già installata
  (function () {
    var standalone = window.matchMedia('(display-mode: standalone)').matches ||
                     navigator.standalone === true;
    if (standalone) return;
    document.addEventListener('DOMContentLoaded', function () {
      var links = document.querySelectorAll('[data-pwa-install]');
      for (var i = 0; i < links.length; i++) links[i].hidden = false;
    });
  })();
</script>
{{end}}
