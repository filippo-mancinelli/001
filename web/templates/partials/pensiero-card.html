{{define "pensiero-card"}}
<div class="pensiero-card">
  {{if .CuriousPending}}
  <details class="attesa-tip">
    <summary class="attesa-btn" aria-label="In attesa di rivelazione">
      <svg class="attesa-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 2h12"/><path d="M6 22h12"/>
        <path d="M7 2c0 4 3 5.5 5 7 2-1.5 5-3 5-7"/>
        <path d="M7 22c0-4 3-5.5 5-7 2 1.5 5 3 5 7"/>
      </svg>
    </summary>
    <span class="attesa-tooltip">in attesa di rivelazione...</span>
  </details>
  {{end}}
  <div class="pensiero-meta">
    <span class="user-tooltip-wrap">
      <details class="user-tooltip">
        <summary class="author">@{{.AuthorName}}</summary>
        <div class="user-tooltip-card"
             hx-get="/users/{{.AuthorName}}/mini"
             hx-trigger="toggle from:closest details once"
             hx-target="this"
             hx-swap="innerHTML"></div>
      </details>
    </span>
    <span style="color:var(--text-dim)">su</span>
    <span class="user-tooltip-wrap">
      <details class="user-tooltip">
        <summary class="subject">@{{.SubjectName}}</summary>
        <div class="user-tooltip-card"
             hx-get="/users/{{.SubjectName}}/mini"
             hx-trigger="toggle from:closest details once"
             hx-target="this"
             hx-swap="innerHTML"></div>
      </details>
    </span>
    {{if .IsDirect}}<span class="badge-direct">versione diretta</span>{{end}}
  </div>
  <div class="pensiero-contenuto">{{.Content}}</div>
  {{if .CanSendCurious}}
  <div class="pensiero-azioni">
    <button class="btn btn-amber btn-sm btn-curioso"
      hx-post="/curious/{{.PensieroID}}"
      hx-target="closest .pensiero-azioni"
      hx-swap="outerHTML"
      hx-disabled-elt="this">
      [ sono curioso ]
    </button>
  </div>
  {{end}}
  <div class="pensiero-reazioni">
    {{template "dna-button" .}}
  </div>
  <div class="pensiero-commenti" id="commenti-{{.PensieroID}}">
    <button class="commenti-toggle"
      hx-get="/pensieri/{{.PensieroID}}/commenti"
      hx-target="#commenti-{{.PensieroID}}"
      hx-swap="innerHTML">
      <svg class="commenti-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-4 4v-4H4z"/></svg>
      <span>[ commenti{{if .CommentCount}} ({{.CommentCount}}){{end}} ]</span>
    </button>
  </div>
</div>
{{end}}
