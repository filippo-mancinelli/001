{{define "pensiero-card"}}
<div class="pensiero-card">
  <div class="pensiero-meta">
    <span class="author">@{{.AuthorName}}</span>
    <span style="color:var(--text-dim)">su</span>
    <span class="subject">@{{.SubjectName}}</span>
    {{if .IsDirect}}<span class="badge-direct">versione diretta</span>{{end}}
  </div>
  <div class="pensiero-contenuto">{{.Content}}</div>
  {{if .CanSendCurious}}
  <div class="pensiero-azioni">
    <button class="btn btn-amber btn-sm"
      hx-post="/curious/{{.PensieroID}}"
      hx-target="closest .pensiero-card"
      hx-swap="outerHTML">
      [ sono curioso ]
    </button>
  </div>
  {{end}}
  {{if .CuriousPending}}
  <div class="pensiero-azioni">
    <span style="color:var(--amber); font-size:0.75rem">richiesta inviata — in attesa...</span>
  </div>
  {{end}}
  <div class="pensiero-commenti" id="commenti-{{.PensieroID}}">
    <button class="commenti-toggle"
      hx-get="/pensieri/{{.PensieroID}}/commenti"
      hx-target="#commenti-{{.PensieroID}}"
      hx-swap="innerHTML">
      [ commenti{{if .CommentCount}} ({{.CommentCount}}){{end}} ]
    </button>
  </div>
</div>
{{end}}
