{{define "commenti-thread"}}
<div class="commenti-thread">
  <div class="commenti-lista">
    {{if .Commenti}}
      {{range .Commenti}}
      <div class="commento" id="commento-{{.ID}}">
        <div class="commento-head">
          <a class="commento-autore" href="/@{{.AuthorName}}">@{{.AuthorName}}</a>
          <span class="commento-data">{{.CreatedAt.Format "02/01 15:04"}}</span>
          {{if .CanDelete}}
          <button class="commento-del" title="elimina commento"
            hx-delete="/commenti/{{.ID}}"
            hx-target="#commenti-{{.PensieroID}}"
            hx-swap="innerHTML"
            hx-confirm="Eliminare questo commento?">×</button>
          {{end}}
        </div>
        <div class="commento-testo">{{.Content}}</div>
      </div>
      {{end}}
    {{else}}
      <div class="commenti-vuoto">nessun commento — scrivi il primo.</div>
    {{end}}
  </div>
  <form class="commento-form"
        hx-post="/pensieri/{{.PensieroID}}/commenti"
        hx-target="#commenti-{{.PensieroID}}"
        hx-swap="innerHTML">
    <textarea name="content" rows="2" maxlength="1000"
              placeholder="scrivi un commento..." required></textarea>
    <button class="btn btn-cyan btn-sm" type="submit">[ invia ]</button>
  </form>
</div>
{{end}}
