<!DOCTYPE html>
<html lang="it">
<head>{{template "head" .}}<title>pensieri // cerca</title></head>
<body>
{{template "nav" .}}
<div class="container" style="padding-top:1rem">
  <div class="panel">
    <div class="panel-title">// trova utenti</div>
    <input
      type="text"
      name="q"
      value="{{.Query}}"
      placeholder="cerca per username..."
      autofocus
      hx-get="/search/results"
      hx-trigger="keyup changed delay:300ms"
      hx-target="#search-results"
      style="width:100%"
    >
  </div>

  <div class="panel" id="search-results">
    {{template "search-results" .}}
  </div>
</div>
{{template "statusbar" .}}
</body>
</html>
