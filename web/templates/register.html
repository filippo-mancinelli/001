<!DOCTYPE html>
<html lang="it">
<head>{{template "head" .}}<title>pensieri // registrazione</title></head>
<body>
<div class="container" style="max-width:420px; padding-top:5rem">
  <div style="text-align:center; margin-bottom:2rem">
    <div class="site-title" style="font-size:2.2rem">[ <span>pensieri</span> ]</div>
    <div class="auth-tagline">CREA UN NUOVO NODO NELLA RETE</div>
  </div>

  <div class="panel">
    <div class="panel-title">// nuovo account</div>

    {{if .error}}
    <div class="alert alert-error">{{.error}}</div>
    {{end}}

    <form method="POST" action="/register">
      <div class="form-group">
        <label>username</label>
        <input type="text" name="username" maxlength="32" autofocus>
      </div>
      <div class="form-group">
        <label>email</label>
        <input type="email" name="email">
      </div>
      <div class="form-group">
        <label>password</label>
        <input type="password" name="password" minlength="6">
      </div>
      <button type="submit" class="btn" style="width:100%">[ crea account ]</button>
    </form>

    {{if .googleEnabled}}
    <div class="oauth-sep"><span>oppure</span></div>
    <a href="/auth/google" class="btn btn-google" style="width:100%">
      {{template "google_icon" .}}<span>registrati con Google</span>
    </a>
    {{end}}

    <hr class="divider">
    <div style="text-align:center; font-size:0.75rem; color:var(--text-dim)">
      hai già un account? <a href="/login">accedi</a>
    </div>
  </div>
</div>
</body>
</html>
